# Prometheus Alert Rules
# ======================
# Every expression below references a metric the code actually emits:
#   worker:      worker/src/metrics.rs
#   coordinator: coordinator/coordinator.py + coordinator/router.py

groups:
  - name: ai_cluster_alerts
    interval: 30s
    rules:
      # Worker availability (scrape-level)
      - alert: WorkerDown
        expr: up{job="workers"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Worker {{ $labels.instance }} is down"
          description: "Worker metrics endpoint has been unreachable for more than 1 minute."

      - alert: CoordinatorDown
        expr: up{job="coordinator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Coordinator is down"
          description: "Coordinator /metrics has been unreachable for more than 1 minute."

      # GPU alerts (worker_gpu_* gauges, labelled by gpu)
      - alert: GPUHighTemperature
        expr: worker_gpu_temperature_celsius > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.instance }} temperature is high"
          description: "GPU temperature is {{ $value }}°C (threshold 85°C)"

      - alert: GPUMemoryPressure
        expr: worker_gpu_memory_used_bytes > 0.9 * 6e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.instance }} memory usage is high"
          description: "GPU memory used: {{ $value | humanize1024 }} (adjust the 6 GB budget to your GPU_VRAM_GB)"

      - alert: GPUUtilizationLow
        expr: worker_gpu_utilization_percent < 10
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.instance }} utilization is low"
          description: "GPU utilization is {{ $value }}% for 30 minutes"

      # Inference latency / errors (worker histograms + counters)
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(worker_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 inference latency"
          description: "P95 latency is {{ $value }}s (threshold 5s)"

      - alert: HighErrorRate
        expr: sum(rate(worker_errors_total[5m])) / clamp_min(sum(rate(worker_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High worker error rate"
          description: "Error ratio is {{ $value | printf \"%.2f\" }} over the last 5 minutes"

      # Coordinator queue pressure
      - alert: CoordinatorBacklog
        expr: coordinator_active_requests > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Coordinator has a large in-flight request backlog"
          description: "{{ $value }} requests active on the coordinator"

      - alert: RouterCircuitBreakersOpen
        expr: router_circuit_breaker_open > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "One or more worker circuit breakers are open"
          description: "{{ $value }} circuit breaker(s) currently open"

      # Model memory (per-model gauge)
      - alert: ModelMemoryHigh
        expr: worker_model_memory_bytes > 5e9
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Model {{ $labels.model }} uses substantial memory"
          description: "{{ $value | humanize1024 }} reserved for {{ $labels.model }}"
