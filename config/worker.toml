# AI Worker Configuration (flat schema — parsed by worker/src/config.rs WorkerConfig)
# Unknown keys are a hard error (deny_unknown_fields).
# Precedence for worker_id / grpc_port / metrics_port / gpu_ids:
#   CLI flag or env var  >  this file  >  built-in default

# llama.cpp engine defaults. `llamacpp_n_threads` is only used when the
# worker binary is built with `--features llamacpp` (in-process engine).
# `llamacpp_default_n_gpu_layers` is shared by BOTH the in-process `llamacpp`
# engine AND the always-compiled `llamaserver` (child-process) engine — it is
# the fallback `-ngl`/`n_gpu_layers` value when a model's registry entry
# omits `[models.X.gguf] n_gpu_layers`. This is the partial-offload knob for
# consumer GPUs (8-16 GB VRAM) that cannot fit every layer on-GPU; -1 (the
# default) offloads everything, matching every deployment's behavior before
# this knob existed. NOTE: WorkerConfig parses flat top-level keys, so these
# MUST stay above the first [section] header in this file.
llamacpp_n_threads = 0              # 0 = llama.cpp auto-detects thread count
llamacpp_default_n_gpu_layers = -1  # -1 = offload all layers to the GPU (both engines)

# ggml-RPC peer ("rpc_server") role for distributed (Level 2, cross-node)
# GGUF splits — see pending-work/11-distributed-multi-node-inference.md.
# Defaulted off: leave commented on every node that never lends a GPU to a
# distributed model's lead. Trusted-LAN only — ggml-RPC has no auth/encryption;
# never set rpc_server_bind_host to a public interface.
# rpc_server_enabled = false        # true on nodes that lend local GPU(s) as an RPC peer
# rpc_server_port = 50151           # base port; one rpc-server process per lent GPU, port+i
# rpc_server_bind_host = "0.0.0.0"  # bind interface for the rpc-server process(es)

# llama-server engine (Plan 13, engine="llamaserver" models). The worker spawns
# and supervises a `llama-server` child per such model; the coordinator proxies
# agentic HTTP inference (OpenAI/Anthropic tool calling, streaming) to it. The
# binary is NOT built by cargo — install llama.cpp's `llama-server` on the host.
# Env LLAMASERVER_BINARY_PATH wins over llamaserver_binary_path.
# llamaserver_binary_path = "llama-server"  # PATH lookup by default; or an absolute path
#
# llamaserver_bind_host default is now "127.0.0.1" (secure by default — the
# `/slots` endpoint can leak another job's prompt text, and there is no
# built-in auth on this port at all). Set explicitly to "0.0.0.0" below ONLY
# because this file ships for the Docker Compose deployment, where the worker
# and coordinator are SEPARATE containers on an isolated bridge network — the
# coordinator can only reach "worker:<port>" if the process inside the
# container binds a container-reachable interface. That is NOT the same as
# LAN/Internet exposure: docker-compose.yml no longer publishes the
# llamaserver ports to the host by default (opt in via
# COMPOSE_PROFILES=...,expose-llamaserver — see docker-compose.yml). Running
# the bare binary outside Docker keeps the secure 127.0.0.1 default unless you
# edit this file.
llamaserver_bind_host = "0.0.0.0"
# llamaserver_enable_slots_endpoint = false  # default; leave off unless something needs /slots

# worker_id = "my-worker"        # optional; auto-generated when absent everywhere
#
# grpc_bind_host: same reasoning as llamaserver_bind_host above — "0.0.0.0" is
# required so the coordinator CONTAINER can reach this worker container over
# the isolated compose network; docker-compose.yml does not publish 50051 to
# the host by default (opt in the same way as the llamaserver ports). The bare
# binary's own default (no worker.toml, or a worker.toml that omits this key)
# stays "127.0.0.1".
grpc_bind_host = "0.0.0.0"
# grpc_auth_token wires to env WORKER_GRPC_AUTH_TOKEN (wins over this value)
# — set it whenever a worker is reachable from more than just its own
# coordinator container, e.g. a LAN cluster where the coordinator runs on a
# different host and this port IS published. See docker-compose.yml /
# .env.example (WORKER_GRPC_AUTH_TOKEN) and docs/deployment.md.
# grpc_auth_token = "change-me"
grpc_port = 50051
metrics_port = 9091
gpu_ids = [0]

# Storage
model_cache_dir = "./models"
download_dir = "./data/downloads"

# Concurrency
max_concurrent_loads = 2
max_concurrent_requests = 32

# Inference
request_timeout_secs = 120

# HuggingFace Hub (HF_TOKEN env var wins when both are set)
# hf_token = "hf_..."
# hf_cache_dir = "/app/models/hf-cache"

# Resident-model cap. This host is a DGX Spark with unified (CPU+GPU shared)
# memory, so the operator wants only ONE model resident at a time: loading a
# new model automatically evicts the oldest-loaded one first. 0 = unlimited
# (no eviction) — the default for other deployments with headroom to keep
# multiple models warm.
max_loaded_models = 1
