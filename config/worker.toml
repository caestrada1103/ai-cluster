# AI Worker Configuration (flat schema — parsed by worker/src/config.rs WorkerConfig)
# Unknown keys are a hard error (deny_unknown_fields).
# Precedence for worker_id / grpc_port / metrics_port / gpu_ids:
#   CLI flag or env var  >  this file  >  built-in default

# llama.cpp engine defaults, shared by the in-process `llamacpp` engine and
# the `llamaserver` child-process engine. Must stay above the first [section]
# header (WorkerConfig parses flat top-level keys). See docs/configuration.md.
llamacpp_n_threads = 0              # 0 = llama.cpp auto-detects thread count
llamacpp_default_n_gpu_layers = -1  # -1 = offload all layers to the GPU (both engines)

# ggml-RPC peer ("rpc_server") role for distributed cross-node GGUF splits
# (feature `llamacpp-rpc`). Off by default; ggml-RPC has no auth/encryption,
# so bind_host must be a specific interconnect address, never "0.0.0.0" — the
# worker refuses to load if it is. See docs/deployment.md.
# rpc_server_enabled = false           # true on nodes that lend local GPU(s) as an RPC peer
# rpc_server_port = 50151              # base port; one ggml-rpc-server process per lent GPU, port+i
# rpc_server_bind_host = "10.0.0.2"    # the node's interconnect IP, e.g. a direct NIC-to-NIC link
# rpc_server_binary_path = "ggml-rpc-server"  # PATH lookup by default; or an absolute path

# llama-server engine (engine="llamaserver" models): the worker spawns and
# supervises a `llama-server` child per such model. Binary not built by
# cargo — install llama.cpp's `llama-server` on the host.
# llamaserver_binary_path = "llama-server"  # PATH lookup by default; or an absolute path
#
# Both bind hosts default to 127.0.0.1. Containers open them up via
# LLAMASERVER_BIND_HOST / WORKER_GRPC_BIND_HOST. See docs/deployment.md.
# llamaserver_bind_host = "127.0.0.1"
# llamaserver_enable_slots_endpoint = false  # default; leave off unless something needs /slots

# worker_id = "my-worker"        # optional; auto-generated when absent everywhere
# grpc_bind_host = "127.0.0.1"
# grpc_auth_token wires to env WORKER_GRPC_AUTH_TOKEN (wins over this value).
# See docs/deployment.md.
# grpc_auth_token = "change-me"
grpc_port = 50051
metrics_port = 9091
gpu_ids = [0]

# Storage
model_cache_dir = "./models"
download_dir = "./data/downloads"

# Concurrency
max_concurrent_loads = 2
max_concurrent_requests = 32

# Inference
request_timeout_secs = 120

# HuggingFace Hub (HF_TOKEN env var wins when both are set)
# hf_token = "hf_..."
# hf_cache_dir = "/app/models/hf-cache"

# Resident-model cap: 1 evicts the oldest-loaded model on a new load;
# 0 = unlimited. See docs/deployment.md (DGX Spark unified-memory sizing).
max_loaded_models = 1
