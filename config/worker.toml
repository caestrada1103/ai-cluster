# AI Worker Configuration (flat schema — parsed by worker/src/config.rs WorkerConfig)
# Unknown keys are a hard error (deny_unknown_fields).
# Precedence for worker_id / grpc_port / metrics_port / gpu_ids:
#   CLI flag or env var  >  this file  >  built-in default

# worker_id = "my-worker"        # optional; auto-generated when absent everywhere
grpc_port = 50051
metrics_port = 9091
gpu_ids = [0]

# Storage
model_cache_dir = "./models"
download_dir = "./data/downloads"

# Concurrency
max_concurrent_loads = 2
max_concurrent_requests = 32

# Inference
request_timeout_secs = 120

# HuggingFace Hub (HF_TOKEN env var wins when both are set)
# hf_token = "hf_..."
# hf_cache_dir = "/app/models/hf-cache"
