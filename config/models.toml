# Burn / safetensors Models (experimental — FP32 reference engine)
# ===================================================================
# `engine` defaults to "burn" for the models below (worker built with default
# cargo features, no --features llamacpp required). Burn loads weights as
# FP32 — it does not quantize (quantization != "none" is rejected) — and runs
# a model on a single GPU per worker; tensor/pipeline parallelism exists in
# worker/src/parallelism.rs but is not wired to inference yet. Treat this as
# the experimental / reference path — the GGUF/llama.cpp section above is the
# primary, recommended engine for the project's consumer-GPU goal.

# DeepSeek Models
# ===============

[models.deepseek-7b]
family = "deepseek"
description = "DeepSeek LLM 7B Base (dense, Llama-style) (Burn FP32 reference engine — single GPU, no quantization)"
parameters = "7B"
min_memory_gb = 16
recommended_gpus = 1
max_gpus = 2

