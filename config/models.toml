# recommended_gpus/max_gpus describe a future multi-GPU tensor/layer split
# for the llama.cpp engine (not yet implemented — one GGUF model per worker today).
[models."qwen2.5-coder-32b-gguf"]
family = "qwen"
description = "Qwen2.5-Coder 32B Instruct — Q4_K_M GGUF, split across 2 consumer GPUs"
parameters = "32B"
min_memory_gb = 20
recommended_gpus = 2
max_gpus = 4
engine = "llamacpp"

[models."qwen2.5-coder-32b-gguf".gguf]
repo_id = "Qwen/Qwen2.5-Coder-32B-Instruct-GGUF"
file = "qwen2.5-coder-32b-instruct-q4_k_m.gguf"
n_gpu_layers = -1  # -1 = offload all layers to the GPU
n_ctx = 8192
# q8_0 KV cache roughly halves VRAM vs the fp16 default, fitting a larger n_ctx.
cache_type_k = "q8_0"
cache_type_v = "q8_0"

# Level 2 distributed (cross-node ggml-RPC) reference schema — demonstrates the
# `.distributed` TOML shape. Not yet wired end-to-end (needs the worker's
# `llamacpp-rpc` feature and a peer `rpc-server` per node). See docs/configuration.md.
[models."qwen2.5-coder-32b-gguf".distributed]
enabled = true
lead = "amd-node-1"
peers = ["amd-node-2", "amd-node-3"]
split = "auto"  # "auto" = derive per-GPU weights from live VRAM at load time
rpc_port = 50151

[models."qwen2.5-coder-32b-gguf".distributed.gpu_ids]
amd-node-1 = [0]
amd-node-2 = [0]
amd-node-3 = [0]

# llama-server (agentic serving)
# ================================
# engine = "llamaserver": a per-model llama-server child process supervised by
# the worker, HTTP-proxied by the coordinator — needed for real tool calling
# (chat templates, GBNF grammars, streaming tool calls), which the in-process
# llamacpp engine can't do. Same [.gguf] fields as above (repo_id, file, n_ctx,
# cache_type_k/v, n_gpu_layers, n_cpu_moe), plus a [models.X.llamaserver] table:
#   port        (int, required)  -> --port <N>, unique per model
#   instances   (int, optional)  -> --parallel <N> conversation slots, default 1
#                                     (alias: parallel; overridable per-load)
#   extra_args  (string, optional) -> whitespace-split, appended to the argv
# n_ctx is PER SLOT — the worker multiplies it by `parallel` before invoking
# llama-server. Full rationale and sizing math: docs/configuration.md.

# --- 16 GB AMD fleet (ACTIVE today) ------------------------------------

[models."devstral-small-2-24b-instruct-gguf"]
family = "mistral"
description = "Devstral Small 2 24B Instruct — dense, agentic coding, 68.0% SWE-bench Verified, 256K native ctx. Q4_K_M GGUF served via llama-server for real tool calling"
parameters = "24B"
min_memory_gb = 15
recommended_gpus = 1
max_gpus = 1
engine = "llamaserver"

[models."devstral-small-2-24b-instruct-gguf".gguf]
# Verified against unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF (14.3 GiB, Q4_K_M).
repo_id = "unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF"
file = "Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf"  # single file, 14.3 GiB
n_ctx = 16384  # per conversation/slot; worker passes -c (n_ctx * parallel) to llama-server
# q8_0 KV cache; VRAM is razor-thin on this 16 GB card. See docs/configuration.md for the sizing math.
cache_type_k = "q8_0"
cache_type_v = "q8_0"

[models."devstral-small-2-24b-instruct-gguf".llamaserver]
port = 8081
parallel = 1  # KV budget above is sized for one slot; see docs/configuration.md before raising this

[models."qwen3-coder-30b-a3b-instruct-gguf"]
family = "qwen"
description = "Qwen3-Coder-30B-A3B-Instruct — MoE (30.5B total / 3.3B active, 128 experts/8-per-token), agentic coding, 256K native ctx. Q4_K_M GGUF served via llama-server; needs MoE CPU-offload to fit 16 GB (see llamaserver.extra_args below)"
parameters = "30B-A3B"
min_memory_gb = 16
recommended_gpus = 1
max_gpus = 1
engine = "llamaserver"

[models."qwen3-coder-30b-a3b-instruct-gguf".gguf]
# Verified against unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF (18.6 GiB, Q4_K_M).
repo_id = "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF"
file = "Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"  # single file, 18.6 GiB
n_ctx = 32768  # per conversation/slot; worker passes -c (n_ctx * parallel) to llama-server
cache_type_k = "q8_0"
cache_type_v = "q8_0"
n_cpu_moe = 40  # keeps the first 40 layers' MoE experts on CPU so the model fits a 16 GB card

[models."qwen3-coder-30b-a3b-instruct-gguf".llamaserver]
port = 8082
parallel = 1  # raising this doubles the KV footprint against a razor-thin 16 GB budget
# n_cpu_moe tuning method and the razor-thin VRAM budget math: docs/configuration.md.

# --- DGX Spark tier (ACTIVE) --------------------------------------------
# Runs on a real DGX Spark (GB10, 121.6 GiB unified memory). Single-file GGUF.
# Full sizing arithmetic (KV scaling, parallel/n_ctx tradeoffs, VRAM budget)
# and the reasoning-mode note below: docs/configuration.md.
[models."qwen3.6-35b-a3b-gguf"]
family = "qwen"
description = "Qwen3.6-35B-A3B — MoE (35B total / 3B active), Apache 2.0. Same active-parameter class as qwen3-coder-30b-a3b, so comparable generation speed on bandwidth-bound hardware, but a newer and stronger model. Single-file Q4_K_XL (22.36 GB). Source: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF"
parameters = "35B-A3B"
min_memory_gb = 34  # ~22.4 GB weights + ~10.9 GB KV cache at parallel=4
recommended_gpus = 1
max_gpus = 1
engine = "llamaserver"

[models."qwen3.6-35b-a3b-gguf".gguf]
repo_id = "unsloth/Qwen3.6-35B-A3B-GGUF"
file = "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
# n_gpu_layers omitted (all layers fit this host's unified memory).
n_ctx = 262144  # per conversation/slot, the model's full native window
# q8_0 roughly halves KV vs the f16 default.
cache_type_k = "q8_0"
cache_type_v = "q8_0"

[models."qwen3.6-35b-a3b-gguf".llamaserver]
# Reasoning disabled: with thinking on, content stays empty until the model
# finishes its (often budget-exhausting) chain-of-thought. See docs/configuration.md.
extra_args = "--reasoning off"
port = 8086
parallel = 4  # sizing math: docs/configuration.md

