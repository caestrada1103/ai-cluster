# Model Configuration Registry
# ============================

# Default settings applied to all models
[defaults]
quantization = "none"
parallelism = "auto"
max_batch_size = 32
max_seq_len = 4096
cache_size_gb = 8
warm_up_prompts = [
    "Hello",
    "What is AI?"
]

# GGUF / llama.cpp (PRIMARY — quantized, consumer NVIDIA+AMD)
# =============================================================
# Native quantization (Q4_K_M/Q5_K_M/Q8_0/...) for consumer GPUs; architecture
# is read from GGUF metadata, so no [.architecture] block is needed. `engine`
# defaults to "burn" elsewhere in this file — these entries opt in with
# `engine = "llamacpp"`. Requires the worker's `llamacpp` cargo feature (not
# built by default). See docs/configuration.md for engine selection rationale.
# Confirm exact GGUF filenames against the HF repo before download — quant
# naming/casing varies by uploader.

[models."qwen2.5-0.5b-gguf"]
family = "qwen"
description = "Qwen2.5 0.5B Instruct — Q4_K_M GGUF served by the llama.cpp engine (smoke-test model)"
parameters = "0.5B"
min_memory_gb = 1
recommended_gpus = 1
max_gpus = 1
engine = "llamacpp"

[models."qwen2.5-0.5b-gguf".gguf]
repo_id = "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
file = "qwen2.5-0.5b-instruct-q4_k_m.gguf"  # ~469 MiB download
n_gpu_layers = -1  # -1 = offload all layers to the GPU
n_ctx = 4096

[models."qwen2.5-7b-instruct-gguf"]
family = "qwen"
description = "Qwen2.5 7B Instruct — Q4_K_M GGUF, fits an 8 GB consumer GPU"
parameters = "7B"
min_memory_gb = 6
recommended_gpus = 1
max_gpus = 1
engine = "llamacpp"

[models."qwen2.5-7b-instruct-gguf".gguf]
repo_id = "Qwen/Qwen2.5-7B-Instruct-GGUF"
file = "qwen2.5-7b-instruct-q4_k_m.gguf"
n_gpu_layers = -1  # -1 = offload all layers to the GPU
n_ctx = 8192

[models."qwen2.5-coder-7b-gguf"]
family = "qwen"
description = "Qwen2.5-Coder 7B Instruct — Q4_K_M GGUF, fits an 8 GB consumer GPU"
