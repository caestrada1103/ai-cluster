# The "split a quantized model across two consumer GPUs" showcase. Multi-GPU
# tensor/layer split for the llama.cpp engine is the upcoming worker feature
# (today the worker loads one GGUF model per worker process); recommended_gpus
# / max_gpus describe the target deployment shape once that lands.
[models."qwen2.5-coder-32b-gguf"]
family = "qwen"
description = "Qwen2.5-Coder 32B Instruct — Q4_K_M GGUF, split across 2 consumer GPUs"
parameters = "32B"
min_memory_gb = 20
recommended_gpus = 2
max_gpus = 4
engine = "llamacpp"

[models."qwen2.5-coder-32b-gguf".gguf]
repo_id = "Qwen/Qwen2.5-Coder-32B-Instruct-GGUF"
file = "qwen2.5-coder-32b-instruct-q4_k_m.gguf"
n_gpu_layers = -1  # -1 = offload all layers to the GPU
n_ctx = 8192

# Level 2 — distributed (cross-node ggml-RPC) reference entry. This is the
# flagship "split across 3 AMD nodes" showcase from pending-work/11. NOT
# usable until Phase 2: it needs the worker's `llamacpp-rpc` feature built
# and a running `rpc-server` process on each peer node (amd-node-2/3). Until
# then this block is inert config-only schema (coordinator Task 6, which
# reads it, is not implemented yet either).
[models."qwen2.5-coder-32b-gguf".distributed]
enabled = true
lead = "amd-node-1"
peers = ["amd-node-2", "amd-node-3"]
split = "auto"  # "auto" = derive per-GPU weights from live VRAM at load time
rpc_port = 50151

[models."qwen2.5-coder-32b-gguf".distributed.gpu_ids]
amd-node-1 = [0]
amd-node-2 = [0]
amd-node-3 = [0]

# Burn / safetensors Models (experimental — FP32 reference engine)
# ===================================================================
# `engine` defaults to "burn" for the models below (worker built with default
# cargo features, no --features llamacpp required). Burn loads weights as
# FP32 — it does not quantize (quantization != "none" is rejected) — and runs
# a model on a single GPU per worker; tensor/pipeline parallelism exists in
# worker/src/parallelism.rs but is not wired to inference yet. Treat this as
# the experimental / reference path — the GGUF/llama.cpp section above is the
# primary, recommended engine for the project's consumer-GPU goal.

# DeepSeek Models
# ===============

[models.deepseek-7b]
family = "deepseek"
description = "DeepSeek LLM 7B Base (dense, Llama-style) (Burn FP32 reference engine — single GPU, no quantization)"
parameters = "7B"
min_memory_gb = 16
recommended_gpus = 1
max_gpus = 2

[models.deepseek-7b.architecture]
num_layers = 30
hidden_size = 4096
num_attention_heads = 32
num_kv_heads = 32
vocab_size = 102400
max_seq_len = 4096
intermediate_size = 11008
rms_norm_eps = 1e-6
rope_theta = 10000.0
is_moe = false

[models.deepseek-7b.paths]
config = "./models/deepseek-7b/config.json"
weights = "./models/deepseek-7b/model.safetensors"
tokenizer = "./models/deepseek-7b/tokenizer.json"
vocab = "./models/deepseek-7b/vocab.json"

[models.deepseek-7b.quantization]
# Quantized inference is planned — the worker loads FP32 today and rejects other values.
supported = ["none"]
default = "none"

[models.deepseek-7b.parallelism]
supported = ["single", "pipeline"]
default = "auto"

[models.deepseek-7b.hf]
repo_id = "deepseek-ai/deepseek-llm-7b-base"
filename = "model.safetensors"

[models.deepseek-67b]
family = "deepseek"
