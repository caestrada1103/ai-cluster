# Model Configuration Registry
# ============================

# REFRESH (2026-07-10, pending-work/13-agentic-serving-llama-server.md Task 4):
# added the 16GB-AMD-fleet `engine = "llamaserver"` entries (Devstral Small 2
# 24B, Qwen3-Coder-30B-A3B-Instruct) and a commented-out "DGX Spark tier"
# block — see the "llama-server (agentic serving, Plan 13)" section below,
# placed after the existing GGUF/llama.cpp section. Also corrected the stale
# `[models."qwen2.5-coder-32b-gguf".distributed]` comment (it read as if that
# dense Qwen2.5 entry were still "the flagship"; Plan 11 retargeted the real
# flagship to Qwen3-Coder-30B-A3B-Instruct). All pre-existing entries below
