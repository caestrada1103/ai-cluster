# Model Configuration Registry
# ============================

# Default settings applied to all models
[defaults]
quantization = "none"
parallelism = "auto"
max_batch_size = 32
max_seq_len = 4096
cache_size_gb = 8
warm_up_prompts = [
    "Hello",
    "What is AI?"
]

# GGUF / llama.cpp (PRIMARY — quantized, consumer NVIDIA+AMD)
# =============================================================
# AICluster's actual goal is running LLM inference on consumer GPUs (gaming-PC
# cards, ~8-16 GB VRAM each, including idle ones) across BOTH NVIDIA and AMD —
# a quantized model that fits in limited VRAM and/or one model split across
# several consumer GPUs. The llama.cpp/GGUF engine is what makes that
# possible: native quantization (Q4_K_M/Q5_K_M/Q8_0/...) instead of the Burn
# engine's FP32-only loader. Served by the worker's llama.cpp engine (worker
# built with `--features llamacpp` [+ `llamacpp-vulkan` | `llamacpp-cuda`]);
# runs on NVIDIA via CUDA/Vulkan and AMD via ROCm/Vulkan. Architecture
# parameters come from GGUF metadata, so no [.architecture] block is needed
# here. `engine` defaults to "burn" for every other model in this file — these
# entries opt in with `engine = "llamacpp"`.
#
# NOTE: llama.cpp is an opt-in cargo feature, not the default build (the
# default cargo build still compiles the Burn/wgpu path only).
#
# NOTE: exact GGUF filenames below should be confirmed against the HF repo
# before download — quant naming/casing varies by uploader.

[models."qwen2.5-0.5b-gguf"]
family = "qwen"
description = "Qwen2.5 0.5B Instruct — Q4_K_M GGUF served by the llama.cpp engine (smoke-test model)"
parameters = "0.5B"
min_memory_gb = 1
recommended_gpus = 1
max_gpus = 1
engine = "llamacpp"

[models."qwen2.5-0.5b-gguf".gguf]
repo_id = "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
file = "qwen2.5-0.5b-instruct-q4_k_m.gguf"  # ~469 MiB download
n_gpu_layers = -1  # -1 = offload all layers to the GPU
n_ctx = 4096

[models."qwen2.5-7b-instruct-gguf"]
family = "qwen"
description = "Qwen2.5 7B Instruct — Q4_K_M GGUF, fits an 8 GB consumer GPU"
parameters = "7B"
min_memory_gb = 6
recommended_gpus = 1
max_gpus = 1
engine = "llamacpp"

[models."qwen2.5-7b-instruct-gguf".gguf]
repo_id = "Qwen/Qwen2.5-7B-Instruct-GGUF"
file = "qwen2.5-7b-instruct-q4_k_m.gguf"
n_gpu_layers = -1  # -1 = offload all layers to the GPU
n_ctx = 8192

[models."qwen2.5-coder-7b-gguf"]
