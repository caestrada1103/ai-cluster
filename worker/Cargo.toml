[package]
name = "ai-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance Rust worker for AI inference with Burn"
repository = "https://github.com/caestrada1103/ai-cluster"

[features]
default = ["wgpu"]  # Auto-detects GPU (NVIDIA, AMD, Intel) via Vulkan/DX12
cuda = ["burn/cuda"]      # Opt-in: native CUDA for best NVIDIA perf
rocm = ["burn/rocm"]      # Opt-in: native ROCm for best AMD perf
wgpu = ["burn/wgpu"]      # Cross-platform GPU via Vulkan/DX12/Metal
metal = ["wgpu", "burn/metal"]  # macOS Metal via wgpu
# llama.cpp inference engine (opt-in; coexists with the Burn features above).
llamacpp = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:once_cell"]
llamacpp-cuda = ["llamacpp", "llama-cpp-2?/cuda"]      # llama.cpp CUDA kernels
llamacpp-vulkan = ["llamacpp", "llama-cpp-2?/vulkan"]  # llama.cpp Vulkan kernels

[dependencies]
# Burn deep learning framework
# Backends are activated via features above; wgpu auto-detects GPU vendor
burn = { version = "0.19", default-features = false, features = ["std", "train", "autodiff"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
wgpu = "26.0.1"

# gRPC
tonic = "0.10"
prost = "0.12"
tonic-health = "0.10"
async-stream = "0.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# HTTP for metrics server
axum = "0.7"

# Loopback HTTP health-check for supervised llama-server processes.
# default-features off keeps it TLS-free (only http://127.0.0.1 is used).
reqwest = { version = "0.12", default-features = false }

# Utilities
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "5.5"

# Model loading
safetensors = "0.4"
tokenizers = { version = "0.15", features = ["http"] }
hf-hub = { version = "0.4.3", features = ["tokio"] }
half = "2.3"
rand = "0.8"

# llama.cpp engine (feature `llamacpp`). llama-cpp-sys-2 builds llama.cpp from
# source via cmake; bindgen requires libclang on the build host.
llama-cpp-2 = { version = "=0.1.150", optional = true }
encoding_rs = { version = "0.8", optional = true }
once_cell = { version = "1", optional = true }

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tempfile = "3.8"
tracing-test = "0.2"
proptest = "1.4"
async-trait = "0.1"