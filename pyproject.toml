[project]
name = "ai-cluster-coordinator"
version = "0.1.0"
description = "Python coordinator for distributed AI inference cluster"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Carlos Estrada", email = "caestrada1103@gmail.com" }
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "grpcio>=1.59.0",
    "grpcio-tools>=1.59.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "toml>=0.10.2",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx>=0.28.1",
    "types-toml",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
extend-exclude = "coordinator/proto/"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B"]
ignore = []
extend-exclude = ["coordinator/proto"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["coordinator/proto/"]

[[tool.mypy.overrides]]
module = "coordinator.proto.*"
follow_imports = "skip"
ignore_errors = true