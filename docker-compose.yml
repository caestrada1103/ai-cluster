# Root docker-compose.yml
# =======================
# Docker Compose configuration for the AI Cluster
#
# Worker image/backend selection is via Compose PROFILES, not by hand-editing
# YAML. Exactly one worker service is meant to be active per compose project
# (single-box, possibly multi-GPU rig) or per host (LAN cluster) — pick the
# profile matching your GPU and set it in .env (COMPOSE_PROFILES=...) or pass
# --profile on the CLI:
#
#   ┌────────────────────────────────────────────────────────────────────────────────┐
#   │  Profile              Service                 Dockerfile BACKEND  Vendor  Perf  │
#   │  amd-vulkan            worker-amd-vulkan        wgpu (default)     AMD     good  │
#   │  nvidia-vulkan         worker-nvidia-vulkan      wgpu (default)     NVIDIA  good  │
#   │  intel-vulkan          worker-intel-vulkan       wgpu (default)     Intel   good  │
#   │  rocm-native           worker-rocm-native        rocm               AMD     best  │
#   │  cuda-native            worker-cuda-native        cuda               NVIDIA  best  │
#   └────────────────────────────────────────────────────────────────────────────────┘
#
# One parameterized docker/Dockerfile.worker covers all of these via
# --build-arg BACKEND=wgpu|rocm|cuda (the *-vulkan profiles all build the same
# universal wgpu image — Vulkan auto-detects AMD/NVIDIA/Intel — and differ only
# in which device nodes get passed through). No profile is active by default:
# `docker compose up -d` alone starts coordinator + monitoring + open-webui but
# deliberately NO worker, so nothing silently assumes one vendor. Set
# COMPOSE_PROFILES in .env to bring a worker up — see .env.example and
# docs/deployment.md for the exact command per GPU (RTX 3080 / RX 9060XT / DGX
# Spark / multi-GPU rig).
#
# Every worker service below joins ai-cluster-net under BOTH its own Compose
# service name AND the network alias "worker" (see each service's `networks:`
# block), so `COORDINATOR_STATIC_WORKERS=["worker:50051"]` keeps working no
# matter which one profile is active. Only activate one single-worker profile
# at a time — see "Multi-GPU hosts" further down for running several at once.
#
# SECURE BY DEFAULT / OPT IN TO EXPOSURE (security audit C1/H1/M11):
# - No worker (`50051`/`9091`/`8081`/`8082`) or Open-WebUI (`8080`) port is
#   published to the HOST by this file anymore — only the coordinator's own
#   API port (`8000`) is. Every worker still binds `0.0.0.0` INSIDE its own
#   container so the coordinator container can reach it over the private
#   `ai-cluster-net` bridge (not the same thing as host/LAN exposure —
#   nothing outside this compose project can reach an unpublished port).
# - The worker's gRPC server additionally supports a shared-secret
#   (`WORKER_GRPC_AUTH_TOKEN`, wired in below) — set it once any of these
#   ports ARE published beyond this host.
# - To reach a worker (or Open-WebUI) from ANOTHER host — the actual LAN
#   multi-node cluster case this project targets — explicitly opt in with
#   the override file: `docker-compose.expose-ports.yml`, e.g.:
#     docker compose -f docker-compose.yml -f docker-compose.expose-ports.yml \
#       --profile cuda-native up -d
#   See that file's header comment and docs/deployment.md.
# - The coordinator itself REFUSES to start when `COORDINATOR_HOST` is not
#   loopback and `COORDINATOR_API_KEYS` is unset (see coordinator/main.py) —
#   since this file's coordinator service DOES publish `8000` to the host by
#   design (it's the REST API clients are meant to call), set
#   `COORDINATOR_API_KEYS` in your `.env` before `docker compose up`, or the
#   coordinator container will exit immediately with an explanatory error.
#   See .env.example.

services:
  # Coordinator
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    image: ai-coordinator:latest
    container_name: ai-coordinator
    environment:
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=8000
      - COORDINATOR_DISCOVERY_METHOD=static
      - COORDINATOR_STATIC_WORKERS=["worker:50051"]
      # C4: was hardcoded to "*" here, unconditionally — this port IS
      # published to the host below, so a wildcard-with-no-auth default was
      # the real-world exposure the audit flagged. Default now comes from
      # coordinator/config.py (empty + an always-on loopback allowance);
      # override in .env only when a browser app on another origin needs it.
      - COORDINATOR_CORS_ORIGINS=${COORDINATOR_CORS_ORIGINS:-}
      # C4: previously not wired through AT ALL — COORDINATOR_API_KEYS could
      # be set in the shell/.env forever and the coordinator process would
      # never see it, silently leaving every route open. Empty by default;
      # the coordinator now refuses to start with a non-loopback
      # COORDINATOR_HOST (true here, since 8000 is published) and no keys —
      # set this in .env before `docker compose up`. See .env.example.
      - COORDINATOR_API_KEYS=${COORDINATOR_API_KEYS:-}
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ai-cluster-net
    ports:
      - "8000:8000" # HTTP API & Metrics
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # M8: bound, not workload-dependent (unlike the GPU workers, whose
    # memory need scales with whatever model is loaded) — safe to cap.
    mem_limit: ${COORDINATOR_MEM_LIMIT:-2g}
    pids_limit: 512

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, AMD device passthrough
  # RX 9060XT and other discrete/APU AMD GPUs. Vendor-neutral Vulkan backend.
  #   COMPOSE_PROFILES=amd-vulkan docker compose up -d
  # ==========================================================================
  worker-amd-vulkan:
    profiles: ["amd-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: &worker-common-env
      - GPU_INDEX=${GPU_INDEX:-0}
      - GPU_VRAM_GB=${GPU_VRAM_GB:-6}
      - WORKER_ID=${WORKER_ID:-}
      - GRPC_BASE_PORT=${GRPC_BASE_PORT:-50051}
      - METRICS_BASE_PORT=${METRICS_BASE_PORT:-9091}
      - GRPC_PORT=${GRPC_PORT:-}
      - METRICS_PORT=${METRICS_PORT:-}
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      # C1: shared-secret gRPC auth (worker/src/grpc_auth.rs). Empty by
      # default — this compose network doesn't publish the gRPC port (see
      # the file header), so loopback-equivalent trust already applies
      # inside the bridge network. REQUIRED once you publish this worker's
      # ports via docker-compose.expose-ports.yml or run it as a standalone
      # LAN-cluster node the coordinator reaches from another host.
      - WORKER_GRPC_AUTH_TOKEN=${WORKER_GRPC_AUTH_TOKEN:-}
    volumes: &worker-common-volumes
      - ./config:/app/config:ro
      - ./models:/app/models
      - ./data:/app/data
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # H1/C1: no ports published here by default (was 50051/9091/8081/8082) —
    # see the file header comment and docker-compose.expose-ports.yml for the
    # explicit opt-in (LAN cluster / coordinator-on-another-host case). The
    # worker container still binds these ports on 0.0.0.0 INSIDE its own
    # network namespace so sibling containers (the coordinator) can reach it
    # via the "worker" alias — that is not the same as host/LAN exposure.
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    # AMD Vulkan device passthrough.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped
    # M8: no mem_limit here (unlike coordinator/monitoring) — model size
    # varies per deployment (a few GB up to 100+ GB unified memory on a DGX
    # Spark), so a fixed cap would break legitimate large-model configs.
    # pids_limit is safe regardless of model size (guards against a runaway
    # fork bomb, not legitimate memory use).
    pids_limit: 2048

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, NVIDIA device passthrough (same image as
  # above — Vulkan auto-detects the vendor). RTX 3080 and other NVIDIA cards,
  # including DGX Spark (Grace-Blackwell, aarch64) as a vendor-neutral fallback
  # if you'd rather not build the native CUDA variant.
  # Requires the NVIDIA Container Toolkit:
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  #   COMPOSE_PROFILES=nvidia-vulkan docker compose up -d
  # ==========================================================================
  worker-nvidia-vulkan:
    profiles: ["nvidia-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # H1/C1: not published by default — see the file header comment.
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]
              capabilities: [gpu]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, Intel device passthrough. Works out of the
  # box via the Mesa ANV Vulkan driver already in the default image — no
  # BACKEND build arg needed, just the /dev/dri device node (no /dev/kfd —
  # that's AMD/ROCm-specific and doesn't exist on an Intel-only host).
  #   COMPOSE_PROFILES=intel-vulkan docker compose up -d
  # ==========================================================================
  worker-intel-vulkan:
    profiles: ["intel-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # H1/C1: not published by default — see the file header comment.
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Worker — AMD native ROCm (burn/rocm, maximum AMD performance).
  #   COMPOSE_PROFILES=rocm-native docker compose up -d
  # ==========================================================================
  worker-rocm-native:
    profiles: ["rocm-native"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BACKEND: rocm
        BUILDER_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
        RUNTIME_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
        BUILDER_EXTRA_PKGS: ""
        RUNTIME_EXTRA_PKGS: ""
    image: ai-worker-amd:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # H1/C1: not published by default — see the file header comment.
    logging: *default-logging
    devices:
      - /dev/kfd
      - /dev/dri
    # M7: seccomp=unconfined removed — device passthrough + group_add
    # (video/render) is the modern, narrower way to grant ROCm/KFD access on
    # current Docker/kernel versions; unconfined disables seccomp filtering
    # entirely (every syscall allowed), which is broader than this actually
    # needs. If your ROCm build hits an EPERM/ENOSYS from a blocked syscall
    # on your kernel, re-add `security_opt: [seccomp=unconfined]` locally as
    # an explicit, documented exception rather than carrying it by default.
    group_add:
      - video
      - render
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Worker — NVIDIA native CUDA (burn/cuda, maximum NVIDIA performance).
  # CUDA 13.0.3 devel+runtime (bumped from 12.6.3 — 12.6's nvcc predates sm_121
  # / Grace-Blackwell GB10 support; confirmed via the Docker Hub registry API
  # that 13.0.3-{devel,runtime}-ubuntu24.04 publish both linux/amd64 and
  # linux/arm64 manifests, so this same block covers an RTX 3080 desktop AND a
  # DGX Spark). Requires the NVIDIA Container Toolkit.
  #   COMPOSE_PROFILES=cuda-native docker compose up -d
  # ==========================================================================
  worker-cuda-native:
    profiles: ["cuda-native"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BACKEND: cuda
        BUILDER_IMAGE: nvidia/cuda:13.0.3-devel-ubuntu24.04
        RUNTIME_IMAGE: nvidia/cuda:13.0.3-runtime-ubuntu24.04
        BUILDER_EXTRA_PKGS: ""
        RUNTIME_EXTRA_PKGS: "libcublas-13-0"
    image: ai-worker-nvidia:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # H1/C1: not published by default — see the file header comment.
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]
              capabilities: [gpu]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Multi-GPU example: uncomment and adjust for machines with multiple GPUs
  # (or several GPUs of different vendors in one box). Each worker gets a
  # unique GPU_INDEX and port pair, its OWN Compose service name (not the
  # shared "worker" alias — with N workers there is no single "worker" to
  # alias to), and its own profile so `docker compose up -d` still starts none
  # of them by default. Base each block on whichever single-GPU service above
  # matches that particular card's vendor (copy its devices/deploy block too).
  # ==========================================================================
  # worker-gpu-0:
  #   profiles: ["multi-gpu"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=0
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50051:50051"
  #     - "9091:9091"
  #   depends_on:
  #     - coordinator

  # worker-gpu-1:
  #   profiles: ["multi-gpu"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=1
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50052:50052"
  #     - "9092:9092"
  #   depends_on:
  #     - coordinator

  # NOTE for multi-GPU: each extra worker needs (a) its own GPU passthrough block
  # (devices/group_add for AMD or deploy.resources.reservations.devices for NVIDIA),
  # (b) an entry in COORDINATOR_STATIC_WORKERS, e.g. ["worker-gpu-0:50051","worker-gpu-1:50052"],
  # (c) a matching target in config/prometheus.yml (workers job). Bring these up
  # with `COMPOSE_PROFILES=multi-gpu docker compose up -d` — do NOT also activate
  # one of the single-GPU profiles above in the same project, since both would
  # try to claim the "worker" network alias and the default GRPC/metrics ports.
  #
  # NOTE for engine="llamaserver" (Plan 13): the multi-GPU example above omits
  # the llamaserver port publishes for brevity — copy the `- "8081:8081"` /
  # `- "8082:8082"` lines from one of the single-GPU worker services above if
  # the coordinator is on another host. Those ports are per-MODEL and globally
  # unique (not per-worker), so one publish covers whichever worker loads that
  # model. See docs/deployment.md "llama-server for agentic serving".
  #
  # NOTE for LAN clusters (a worker per separate PC): run this same
  # docker-compose.yml on each worker host with only that host's worker
  # service targeted and --no-deps (so it doesn't also spin up a local
  # coordinator), e.g. on a DGX Spark acting as one node in a cluster:
  #   COMPOSE_PROFILES=cuda-native docker compose up -d --no-deps worker-cuda-native
  # then point the coordinator (run once, on its own host) at every worker
  # host:port via COORDINATOR_STATIC_WORKERS. See docs/deployment.md section 3.

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - ai-cluster-net
    ports:
      - "9099:9090"
    logging: *default-logging
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-2g}
    pids_limit: 256

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - ai-cluster-net
    ports:
      - "3000:3000"
    logging: *default-logging
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-1g}
    pids_limit: 256

  # Open-WebUI (Chat Interface). M11: WEBUI_AUTH now defaults to True (was
  # False — "disable login screen for local network", but this service DOES
  # publish 8080 by default... except it no longer does either, see below)
  # and the host port is opt-in via docker-compose.expose-ports.yml, same as
  # the worker ports — set WEBUI_AUTH=False yourself only if you've deliberately
  # decided this instance never leaves a trusted LAN.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    container_name: ai-open-webui
    environment:
      - OPENAI_API_BASE_URLS=http://coordinator:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENABLE_OLLAMA_API=False
      - WEBUI_AUTH=${WEBUI_AUTH:-True}
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-cluster-net
    # M11: not published by default — opt in via docker-compose.expose-ports.yml
    # (adds "8080:8080") once you actually want to browse to this from
    # outside the host running Docker.
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${OPEN_WEBUI_MEM_LIMIT:-2g}
    pids_limit: 512

networks:
  ai-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data:
  open-webui-data:
