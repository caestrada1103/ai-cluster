# Root docker-compose.yml
# =======================
# Docker Compose configuration for the AI Cluster
#
# Worker image/backend selection is via Compose PROFILES, not by hand-editing
# YAML. Exactly one worker service is meant to be active per compose project
# (single-box, possibly multi-GPU rig) or per host (LAN cluster) — pick the
# profile matching your GPU and set it in .env (COMPOSE_PROFILES=...) or pass
# --profile on the CLI:
#
#   ┌────────────────────────────────────────────────────────────────────────────────┐
#   │  Profile              Service                 Dockerfile BACKEND  Vendor  Perf  │
#   │  amd-vulkan            worker-amd-vulkan        wgpu (default)     AMD     good  │
#   │  nvidia-vulkan         worker-nvidia-vulkan      wgpu (default)     NVIDIA  good  │
#   │  intel-vulkan          worker-intel-vulkan       wgpu (default)     Intel   good  │
#   │  rocm-native           worker-rocm-native        rocm               AMD     best  │
#   │  cuda-native            worker-cuda-native        cuda               NVIDIA  best  │
#   └────────────────────────────────────────────────────────────────────────────────┘
#
# One parameterized docker/Dockerfile.worker covers all of these via
# --build-arg BACKEND=wgpu|rocm|cuda (the *-vulkan profiles all build the same
# universal wgpu image — Vulkan auto-detects AMD/NVIDIA/Intel — and differ only
# in which device nodes get passed through). No profile is active by default:
# `docker compose up -d` alone starts coordinator + monitoring + open-webui but
# deliberately NO worker, so nothing silently assumes one vendor. Set
# COMPOSE_PROFILES in .env to bring a worker up — see .env.example and
# docs/deployment.md for the exact command per GPU (RTX 3080 / RX 9060XT / DGX
# Spark / multi-GPU rig).
#
# Every worker service below joins ai-cluster-net under BOTH its own Compose
# service name AND the network alias "worker" (see each service's `networks:`
# block), so `COORDINATOR_STATIC_WORKERS=["worker:50051"]` keeps working no
# matter which one profile is active. Only activate one single-worker profile
# at a time — see "Multi-GPU hosts" further down for running several at once.

services:
  # Coordinator
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    image: ai-coordinator:latest
    container_name: ai-coordinator
    environment:
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=8000
      - COORDINATOR_DISCOVERY_METHOD=static
      - COORDINATOR_STATIC_WORKERS=["worker:50051"]
      - COORDINATOR_CORS_ORIGINS=${COORDINATOR_CORS_ORIGINS:-*}
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ai-cluster-net
    ports:
      - "8000:8000" # HTTP API & Metrics
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, AMD device passthrough
  # RX 9060XT and other discrete/APU AMD GPUs. Vendor-neutral Vulkan backend.
  #   COMPOSE_PROFILES=amd-vulkan docker compose up -d
  # ==========================================================================
  worker-amd-vulkan:
    profiles: ["amd-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: &worker-common-env
      - GPU_INDEX=${GPU_INDEX:-0}
      - GPU_VRAM_GB=${GPU_VRAM_GB:-6}
      - WORKER_ID=${WORKER_ID:-}
      - GRPC_BASE_PORT=${GRPC_BASE_PORT:-50051}
      - METRICS_BASE_PORT=${METRICS_BASE_PORT:-9091}
      - GRPC_PORT=${GRPC_PORT:-}
      - METRICS_PORT=${METRICS_PORT:-}
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes: &worker-common-volumes
      - ./config:/app/config:ro
      - ./models:/app/models
      - ./data:/app/data
    networks:
      ai-cluster-net:
        aliases:
          - worker
    ports: &worker-common-ports
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
      - "${METRICS_PORT:-9091}:${METRICS_PORT:-9091}"
      # llama-server (Plan 13, engine="llamaserver") registry ports — one per
      # llamaserver model in config/models.toml (8081 Devstral, 8082 Qwen3-Coder;
      # coordinator-assigned, globally unique per model). The coordinator proxies
      # agentic HTTP inference to worker_host:<port>. Within this compose network
      # it reaches the worker as "worker:8081" without publishing; publish them (as
      # below) only when the coordinator runs on ANOTHER host and must reach these
      # over the LAN. Trusted-LAN only — firewall them (that hop is unauthenticated).
      - "8081:8081"
      - "8082:8082"
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    # AMD Vulkan device passthrough.
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
      - render
    restart: unless-stopped

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, NVIDIA device passthrough (same image as
  # above — Vulkan auto-detects the vendor). RTX 3080 and other NVIDIA cards,
  # including DGX Spark (Grace-Blackwell, aarch64) as a vendor-neutral fallback
  # if you'd rather not build the native CUDA variant.
  # Requires the NVIDIA Container Toolkit:
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  #   COMPOSE_PROFILES=nvidia-vulkan docker compose up -d
  # ==========================================================================
  worker-nvidia-vulkan:
    profiles: ["nvidia-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    ports: *worker-common-ports
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]
              capabilities: [gpu]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, Intel device passthrough. Works out of the
  # box via the Mesa ANV Vulkan driver already in the default image — no
  # BACKEND build arg needed, just the /dev/dri device node (no /dev/kfd —
  # that's AMD/ROCm-specific and doesn't exist on an Intel-only host).
  #   COMPOSE_PROFILES=intel-vulkan docker compose up -d
  # ==========================================================================
  worker-intel-vulkan:
    profiles: ["intel-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    ports: *worker-common-ports
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped

  # ==========================================================================
  # Worker — AMD native ROCm (burn/rocm, maximum AMD performance).
  #   COMPOSE_PROFILES=rocm-native docker compose up -d
  # ==========================================================================
  worker-rocm-native:
    profiles: ["rocm-native"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BACKEND: rocm
        BUILDER_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
        RUNTIME_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
        BUILDER_EXTRA_PKGS: ""
        RUNTIME_EXTRA_PKGS: ""
    image: ai-worker-amd:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    ports: *worker-common-ports
    logging: *default-logging
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
      - render
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Worker — NVIDIA native CUDA (burn/cuda, maximum NVIDIA performance).
  # CUDA 13.0.3 devel+runtime (bumped from 12.6.3 — 12.6's nvcc predates sm_121
  # / Grace-Blackwell GB10 support; confirmed via the Docker Hub registry API
  # that 13.0.3-{devel,runtime}-ubuntu24.04 publish both linux/amd64 and
  # linux/arm64 manifests, so this same block covers an RTX 3080 desktop AND a
  # DGX Spark). Requires the NVIDIA Container Toolkit.
  #   COMPOSE_PROFILES=cuda-native docker compose up -d
  # ==========================================================================
  worker-cuda-native:
    profiles: ["cuda-native"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BACKEND: cuda
        BUILDER_IMAGE: nvidia/cuda:13.0.3-devel-ubuntu24.04
        RUNTIME_IMAGE: nvidia/cuda:13.0.3-runtime-ubuntu24.04
        BUILDER_EXTRA_PKGS: ""
        RUNTIME_EXTRA_PKGS: "libcublas-13-0"
    image: ai-worker-nvidia:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    ports: *worker-common-ports
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]
              capabilities: [gpu]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Multi-GPU example: uncomment and adjust for machines with multiple GPUs
  # (or several GPUs of different vendors in one box). Each worker gets a
  # unique GPU_INDEX and port pair, its OWN Compose service name (not the
  # shared "worker" alias — with N workers there is no single "worker" to
  # alias to), and its own profile so `docker compose up -d` still starts none
  # of them by default. Base each block on whichever single-GPU service above
  # matches that particular card's vendor (copy its devices/deploy block too).
  # ==========================================================================
  # worker-gpu-0:
  #   profiles: ["multi-gpu"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=0
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50051:50051"
  #     - "9091:9091"
  #   depends_on:
  #     - coordinator

  # worker-gpu-1:
  #   profiles: ["multi-gpu"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=1
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50052:50052"
  #     - "9092:9092"
  #   depends_on:
  #     - coordinator

  # NOTE for multi-GPU: each extra worker needs (a) its own GPU passthrough block
  # (devices/group_add for AMD or deploy.resources.reservations.devices for NVIDIA),
  # (b) an entry in COORDINATOR_STATIC_WORKERS, e.g. ["worker-gpu-0:50051","worker-gpu-1:50052"],
  # (c) a matching target in config/prometheus.yml (workers job). Bring these up
  # with `COMPOSE_PROFILES=multi-gpu docker compose up -d` — do NOT also activate
  # one of the single-GPU profiles above in the same project, since both would
  # try to claim the "worker" network alias and the default GRPC/metrics ports.
  #
  # NOTE for engine="llamaserver" (Plan 13): the multi-GPU example above omits
  # the llamaserver port publishes for brevity — copy the `- "8081:8081"` /
  # `- "8082:8082"` lines from one of the single-GPU worker services above if
  # the coordinator is on another host. Those ports are per-MODEL and globally
  # unique (not per-worker), so one publish covers whichever worker loads that
  # model. See docs/deployment.md "llama-server for agentic serving".
  #
  # NOTE for LAN clusters (a worker per separate PC): run this same
  # docker-compose.yml on each worker host with only that host's worker
  # service targeted and --no-deps (so it doesn't also spin up a local
  # coordinator), e.g. on a DGX Spark acting as one node in a cluster:
  #   COMPOSE_PROFILES=cuda-native docker compose up -d --no-deps worker-cuda-native
  # then point the coordinator (run once, on its own host) at every worker
  # host:port via COORDINATOR_STATIC_WORKERS. See docs/deployment.md section 3.

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - ai-cluster-net
    ports:
      - "9099:9090"
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - ai-cluster-net
    ports:
      - "3000:3000"
    logging: *default-logging
    depends_on:
      - prometheus
    restart: unless-stopped

  # Open-WebUI (Chat Interface)
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    container_name: ai-open-webui
    environment:
      - OPENAI_API_BASE_URLS=http://coordinator:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENABLE_OLLAMA_API=False
      - WEBUI_AUTH=False # Disable login screen for local network
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-cluster-net
    ports:
      - "8080:8080"
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

networks:
  ai-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data:
  open-webui-data:
