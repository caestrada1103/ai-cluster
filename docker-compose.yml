  #   depends_on:
  #     - coordinator
  #   restart: unless-stopped

  # ==========================================================================
  # Worker — NVIDIA native CUDA (burn/cuda, maximum NVIDIA performance)
  # Replace the "worker" service above with this block for NVIDIA max performance.
  # Requires NVIDIA Container Toolkit.
  # ==========================================================================
  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker
  #     args:
  #       BACKEND: cuda
  #       BUILDER_IMAGE: nvidia/cuda:12.6.3-devel-ubuntu24.04
  #       RUNTIME_IMAGE: nvidia/cuda:12.6.3-runtime-ubuntu24.04
  #       BUILDER_EXTRA_PKGS: ""
  #       RUNTIME_EXTRA_PKGS: "libcublas-12-6"
  #   image: ai-worker-nvidia:latest
  #   environment:
  #     - GPU_INDEX=${GPU_INDEX:-0}
  #     - GPU_VRAM_GB=${GPU_VRAM_GB:-6}
