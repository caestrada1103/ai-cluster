# Root docker-compose.yml
# =======================
# Docker Compose configuration for the AI Cluster
#
# Worker image selection — uncomment the block that matches your GPU:
#
#   ┌───────────────────────────────────────────────────────────────────────┐
#   │  Dockerfile               BACKEND arg   AMD  NVIDIA  Intel  Perf     │
#   │  docker/Dockerfile.worker  wgpu (default) ✓    ✓       ✓      good   │ ← default
#   │  docker/Dockerfile.worker  rocm           ✓    ✗       ✗      best   │
#   │  docker/Dockerfile.worker  cuda           ✗    ✓       ✗      best   │
#   └───────────────────────────────────────────────────────────────────────┘
#
# One parameterized docker/Dockerfile.worker covers all three variants via
# --build-arg BACKEND=wgpu|rocm|cuda (see the commented build.args blocks
# below). The default "worker" service uses the universal wgpu image with
# AMD device passthrough.  NVIDIA and high-perf AMD alternatives are
# commented out below — swap the active "worker" block as needed.

services:
  # Coordinator
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    image: ai-coordinator:latest
    container_name: ai-coordinator
    environment:
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=8000
      - COORDINATOR_DISCOVERY_METHOD=static
      - COORDINATOR_STATIC_WORKERS=["worker:50051"]
      - COORDINATOR_CORS_ORIGINS=${COORDINATOR_CORS_ORIGINS:-*}
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ai-cluster-net
    ports:
      - "8000:8000" # HTTP API & Metrics
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan (AMD + NVIDIA + Intel)
  # Default: AMD device passthrough.
  # NVIDIA users: remove "devices / security_opt / group_add" and add the
  #   "deploy.resources.reservations.devices" block from the NVIDIA section.
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment:
      - GPU_INDEX=${GPU_INDEX:-0}
      - GPU_VRAM_GB=${GPU_VRAM_GB:-6}
      - WORKER_ID=${WORKER_ID:-}
      - GRPC_BASE_PORT=${GRPC_BASE_PORT:-50051}
      - METRICS_BASE_PORT=${METRICS_BASE_PORT:-9091}
      - GRPC_PORT=${GRPC_PORT:-}
      - METRICS_PORT=${METRICS_PORT:-}
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models
      - ./data:/app/data
    networks:
      - ai-cluster-net
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
      - "${METRICS_PORT:-9091}:${METRICS_PORT:-9091}"
      # llama-server (Plan 13, engine="llamaserver") registry ports — one per
      # llamaserver model in config/models.toml (8081 Devstral, 8082 Qwen3-Coder;
      # coordinator-assigned, globally unique per model). The coordinator proxies
      # agentic HTTP inference to worker_host:<port>. Within this compose network
      # it reaches the worker as "worker:8081" without publishing; publish them (as
      # below) only when the coordinator runs on ANOTHER host and must reach these
      # over the LAN. Trusted-LAN only — firewall them (that hop is unauthenticated).
      - "8081:8081"
      - "8082:8082"
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    # AMD Vulkan device passthrough — remove these three keys for NVIDIA
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
      - render
    restart: unless-stopped

  # ==========================================================================
  # Worker — NVIDIA wgpu/Vulkan (same universal image, NVIDIA device access)
  # Replace the "worker" service above with this block on NVIDIA machines.
  # Requires NVIDIA Container Toolkit:
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  # ==========================================================================
  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=${GPU_INDEX:-0}
  #     - GPU_VRAM_GB=${GPU_VRAM_GB:-6}
  #     - WORKER_ID=${WORKER_ID:-}
  #     - GRPC_BASE_PORT=${GRPC_BASE_PORT:-50051}
  #     - METRICS_BASE_PORT=${METRICS_BASE_PORT:-9091}
  #     - RUST_LOG=${RUST_LOG:-info}
  #     - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
  #     - HF_TOKEN=${HF_TOKEN:-}
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #     - ./data:/app/data
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
  #     - "${METRICS_PORT:-9091}:${METRICS_PORT:-9091}"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["${GPU_INDEX:-0}"]
  #             capabilities: [gpu]
  #   depends_on:
  #     - coordinator
  #   restart: unless-stopped

  # ==========================================================================
  # Worker — AMD native ROCm (burn/rocm, maximum AMD performance)
  # Replace the "worker" service above with this block for AMD max performance.
  # ==========================================================================
  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker
  #     args:
  #       BACKEND: rocm
  #       BUILDER_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
  #       RUNTIME_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
  #       BUILDER_EXTRA_PKGS: ""
  #       RUNTIME_EXTRA_PKGS: ""
  #   image: ai-worker-amd:latest
  #   environment:
  #     - GPU_INDEX=${GPU_INDEX:-0}
  #     - GPU_VRAM_GB=${GPU_VRAM_GB:-6}
  #     - WORKER_ID=${WORKER_ID:-}
  #     - GRPC_BASE_PORT=${GRPC_BASE_PORT:-50051}
  #     - METRICS_BASE_PORT=${METRICS_BASE_PORT:-9091}
  #     - RUST_LOG=${RUST_LOG:-info}
  #     - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
  #     - HF_TOKEN=${HF_TOKEN:-}
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #     - ./data:/app/data
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
  #     - "${METRICS_PORT:-9091}:${METRICS_PORT:-9091}"
  #   devices:
  #     - /dev/kfd
  #     - /dev/dri
  #   security_opt:
  #     - seccomp=unconfined
  #   group_add:
