  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["${GPU_INDEX:-0}"]
  #             capabilities: [gpu]
  #   depends_on:
  #     - coordinator
  #   restart: unless-stopped

  # ==========================================================================
  # Multi-GPU example: uncomment and adjust for machines with multiple GPUs.
  # Each worker gets a unique GPU_INDEX and port pair.
  # Applies to any of the Dockerfile variants above — just change the
  # dockerfile and image fields to match your chosen backend.
  # ==========================================================================
  # worker-gpu-0:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=0
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50051:50051"
  #     - "9091:9091"
  #   depends_on:
  #     - coordinator

  # worker-gpu-1:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=1
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50052:50052"
  #     - "9092:9092"
  #   depends_on:
  #     - coordinator

  # NOTE for multi-GPU: each extra worker needs (a) its own GPU passthrough block
  # (devices/group_add for AMD or deploy.resources.reservations.devices for NVIDIA),
  # (b) an entry in COORDINATOR_STATIC_WORKERS, e.g. ["worker-gpu-0:50051","worker-gpu-1:50052"],
  # (c) a matching target in config/prometheus.yml (workers job).
  #
  # NOTE for engine="llamaserver" (Plan 13): the alternate worker blocks above
  # (NVIDIA/ROCm/CUDA) omit the llamaserver port publishes for brevity — copy the
  # `- "8081:8081"` / `- "8082:8082"` lines from the default worker when swapping
  # one in, if the coordinator is on another host. Those ports are per-MODEL and
  # globally unique (not per-worker), so one publish covers whichever worker loads
  # that model. See docs/deployment.md "llama-server for agentic serving".

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - ai-cluster-net
    ports:
      - "9099:9090"
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - ai-cluster-net
    ports:
      - "3000:3000"
    logging: *default-logging
    depends_on:
      - prometheus
    restart: unless-stopped

  # Open-WebUI (Chat Interface)
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    container_name: ai-open-webui
    environment:
      - OPENAI_API_BASE_URLS=http://coordinator:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENABLE_OLLAMA_API=False
      - WEBUI_AUTH=False # Disable login screen for local network
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-cluster-net
    ports:
      - "8080:8080"
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

networks:
  ai-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data:
  open-webui-data:
