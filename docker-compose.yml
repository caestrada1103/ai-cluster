# Root docker-compose.yml
# =======================
# Worker backend/vendor selection is via Compose profiles (amd-vulkan,
# nvidia-vulkan, intel-vulkan, rocm-native, cuda-native) — set COMPOSE_PROFILES
# in .env or pass --profile; none is active by default (`docker compose up -d`
# alone starts only coordinator + monitoring + open-webui). Only the
# coordinator's port (8000) is published to the host — worker/Open-WebUI ports
# require the docker-compose.expose-ports.yml override. Full profile table,
# security posture, and per-GPU commands: docs/deployment.md, .env.example.

services:
  # Coordinator
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    image: ai-coordinator:latest
    container_name: ai-coordinator
    environment:
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=8000
      - COORDINATOR_DISCOVERY_METHOD=static
      - COORDINATOR_STATIC_WORKERS=["worker:50051"]
      # Default comes from coordinator/config.py (empty + an always-on loopback
      # allowance); override in .env only when another origin needs CORS.
      - COORDINATOR_CORS_ORIGINS=${COORDINATOR_CORS_ORIGINS:-}
      # Empty by default; the coordinator refuses to start with a non-loopback
      # COORDINATOR_HOST (true here, since 8000 is published) and no keys —
      # set this in .env before `docker compose up`. See .env.example.
      - COORDINATOR_API_KEYS=${COORDINATOR_API_KEYS:-}
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ai-cluster-net
    ports:
      - "8000:8000" # HTTP API & Metrics
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Fixed, unlike the GPU workers whose memory need scales with the loaded model.
    mem_limit: ${COORDINATOR_MEM_LIMIT:-2g}
    pids_limit: 512

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, AMD device passthrough
  # RX 9060XT and other discrete/APU AMD GPUs. Vendor-neutral Vulkan backend.
  #   COMPOSE_PROFILES=amd-vulkan docker compose up -d
  # ==========================================================================
  worker-amd-vulkan:
    profiles: ["amd-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: &worker-common-env
      - GPU_INDEX=${GPU_INDEX:-0}
      - GPU_VRAM_GB=${GPU_VRAM_GB:-}
      - WORKER_ID=${WORKER_ID:-}
      - GRPC_BASE_PORT=${GRPC_BASE_PORT:-50051}
      - METRICS_BASE_PORT=${METRICS_BASE_PORT:-9091}
      - GRPC_PORT=${GRPC_PORT:-}
      - METRICS_PORT=${METRICS_PORT:-}
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - HF_TOKEN=${HF_TOKEN:-}
      # Shared-secret gRPC auth (worker/src/grpc_auth.rs). Empty by default;
      # required once this worker's ports are published (expose-ports.yml)
      # or reached from another host.
      - WORKER_GRPC_AUTH_TOKEN=${WORKER_GRPC_AUTH_TOKEN:-}
      # Containers bind the Compose network, not loopback; the worker's
      # own default stays 127.0.0.1 for bare-metal runs.
      - WORKER_GRPC_BIND_HOST=${WORKER_GRPC_BIND_HOST:-0.0.0.0}
      - LLAMASERVER_BIND_HOST=${LLAMASERVER_BIND_HOST:-0.0.0.0}
    volumes: &worker-common-volumes
      - ./config:/app/config:ro
      - ./models:/app/models
      - ./data:/app/data
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # No ports published by default — see the file header comment and
    # docker-compose.expose-ports.yml for the explicit opt-in.
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    # AMD Vulkan device passthrough.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped
    # No mem_limit here (unlike coordinator/monitoring) — model size varies
    # too widely across deployments; pids_limit alone guards against a runaway fork bomb.
    pids_limit: 2048

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, NVIDIA device passthrough (same image as
  # above — Vulkan auto-detects the vendor). Requires the NVIDIA Container Toolkit.
  #   COMPOSE_PROFILES=nvidia-vulkan docker compose up -d
  # ==========================================================================
  worker-nvidia-vulkan:
    profiles: ["nvidia-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # Not published by default — see the file header comment.
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]
              capabilities: [gpu]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Worker — Universal wgpu/Vulkan, Intel device passthrough (Mesa ANV
  # driver, default image, no BACKEND build arg needed).
  #   COMPOSE_PROFILES=intel-vulkan docker compose up -d
  # ==========================================================================
  worker-intel-vulkan:
    profiles: ["intel-vulkan"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: ai-worker:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # Not published by default — see the file header comment.
    logging: *default-logging
    depends_on:
      coordinator:
        condition: service_healthy
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Worker — AMD native ROCm (burn/rocm, maximum AMD performance).
  #   COMPOSE_PROFILES=rocm-native docker compose up -d
  # ==========================================================================
  worker-rocm-native:
    profiles: ["rocm-native"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BACKEND: rocm
        BUILDER_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
        RUNTIME_IMAGE: rocm/dev-ubuntu-24.04:6.2.1
        BUILDER_EXTRA_PKGS: ""
        RUNTIME_EXTRA_PKGS: ""
    image: ai-worker-amd:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # Not published by default — see the file header comment.
    logging: *default-logging
    devices:
      - /dev/kfd
      - /dev/dri
    # Device passthrough + group_add (video/render) grants ROCm/KFD access
    # without seccomp=unconfined. If your kernel hits an EPERM/ENOSYS from a
    # blocked syscall, re-add `security_opt: [seccomp=unconfined]` locally.
    group_add:
      - video
      - render
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Worker — NVIDIA native CUDA (burn/cuda, maximum NVIDIA performance).
  # CUDA 13.0.3 devel+runtime (needed for sm_121/Grace-Blackwell GB10 support);
  # publishes both linux/amd64 and linux/arm64. Requires the NVIDIA Container Toolkit.
  #   COMPOSE_PROFILES=cuda-native docker compose up -d
  # ==========================================================================
  worker-cuda-native:
    profiles: ["cuda-native"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        BACKEND: cuda
        BUILDER_IMAGE: nvidia/cuda:13.0.3-devel-ubuntu24.04
        RUNTIME_IMAGE: nvidia/cuda:13.0.3-runtime-ubuntu24.04
        BUILDER_EXTRA_PKGS: ""
        RUNTIME_EXTRA_PKGS: "libcublas-13-0"
    image: ai-worker-nvidia:latest
    environment: *worker-common-env
    volumes: *worker-common-volumes
    networks:
      ai-cluster-net:
        aliases:
          - worker
    # Not published by default — see the file header comment.
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]
              capabilities: [gpu]
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    pids_limit: 2048

  # ==========================================================================
  # Multi-GPU example: uncomment and adjust for machines with multiple GPUs.
  # Each worker needs its own GPU_INDEX, port pair, and Compose service name
  # (not the shared "worker" alias). Base each block on the matching
  # single-GPU service above (copy its devices/deploy block too).
  # ==========================================================================
  # worker-gpu-0:
  #   profiles: ["multi-gpu"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=0
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50051:50051"
  #     - "9091:9091"
  #   depends_on:
  #     - coordinator

  # worker-gpu-1:
  #   profiles: ["multi-gpu"]
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker   # add args: BACKEND: rocm|cuda for native variants
  #   image: ai-worker:latest
  #   environment:
  #     - GPU_INDEX=1
  #     - GRPC_BASE_PORT=50051
  #     - METRICS_BASE_PORT=9091
  #     - RUST_LOG=info
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./models:/app/models
  #   networks:
  #     - ai-cluster-net
  #   ports:
  #     - "50052:50052"
  #     - "9092:9092"
  #   depends_on:
  #     - coordinator

  # Multi-GPU also needs: (a) GPU passthrough per worker, (b) an entry in
  # COORDINATOR_STATIC_WORKERS per worker, (c) a matching target in
  # config/prometheus.yml. Do not also activate a single-GPU profile in the
  # same project — both would claim the "worker" alias and default ports.
  # For LAN clusters (a worker per host) and llamaserver port publishing,
  # see docs/deployment.md.

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - ai-cluster-net
    ports:
      - "9099:9090"
    logging: *default-logging
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-2g}
    pids_limit: 256

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - ai-cluster-net
    ports:
      - "3000:3000"
    logging: *default-logging
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-1g}
    pids_limit: 256

  # Open-WebUI (Chat Interface). WEBUI_AUTH defaults to True; set it False
  # yourself only if this instance never leaves a trusted LAN.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    container_name: ai-open-webui
    environment:
      - OPENAI_API_BASE_URLS=http://coordinator:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENABLE_OLLAMA_API=False
      - WEBUI_AUTH=${WEBUI_AUTH:-True}
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - ai-cluster-net
    # Not published by default — opt in via docker-compose.expose-ports.yml (adds "8080:8080").
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${OPEN_WEBUI_MEM_LIMIT:-2g}
    pids_limit: 512

networks:
  ai-cluster-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data:
  open-webui-data:
